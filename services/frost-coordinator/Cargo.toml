[package]
name = "zkfied-frost-coordinator"
version = "1.0.0"
edition = "2021"

[lib]
name = "zkfied_frost_coordinator"
path = "src/lib.rs"

[[bin]]
name = "zkfied-frost-coordinator"
path = "src/main.rs"

[dependencies]
# FROST threshold signatures for Zcash
frost-rerandomized = "2.2.0"
frost-core = "2.2.0"

# Zcash cryptographic primitives and wallet backend (QED-it ZSA fork)
zcash_protocol = { git = "https://github.com/QED-it/librustzcash", branch = "zsa1" }
zcash_primitives = { git = "https://github.com/QED-it/librustzcash", branch = "zsa1" }
zcash_client_backend = { git = "https://github.com/QED-it/librustzcash", branch = "zsa1", features = ["lightwalletd-tonic"] }
zcash_keys = { git = "https://github.com/QED-it/librustzcash", branch = "zsa1", features = ["sapling", "orchard", "transparent-inputs"] }
zcash_address = { git = "https://github.com/QED-it/librustzcash", branch = "zsa1" }
zcash_proofs = { git = "https://github.com/QED-it/librustzcash", branch = "zsa1" }
sapling-crypto = { git = "https://github.com/QED-it/sapling-crypto", rev = "9393f93fe547d1b3738c9f4618c0f8a2fffed29f" }
tonic = "0.13"
prost = "0.13"
zip32 = "0.2"
jubjub = "0.10"
group = "0.13"
subtle = "2.6"
rand_core = { version = "0.6", features = ["getrandom"] }
secrecy = "0.8"

# HTTP server
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-big-array = "0.5"
hex = "0.4"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and metrics
tracing = "0.1"
prometheus = "0.13"
lazy_static = "1.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cryptography
blake2 = { version = "0.10", features = ["std"] }
sha2 = "0.10"
frost-ristretto255 = "2.2.0"
babyjubjub-rs = "0.0.10"
num-bigint = "0.4"
digest = "0.10"
chacha20poly1305 = "0.10"

# Time
chrono = "0.4"

# Environment
dotenv = "0.15"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
base64 = "0.22"
uuid = { version = "1.0", features = ["v4", "serde"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
bip39 = { version = "2.0", features = ["rand"] }

# RPC Client
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "rustls-tls"] }

# Pin home crate to version compatible with Rust 1.86
home = "=0.5.9"

# NEAR Protocol Integration
near-crypto = "0.31"
near-primitives = "0.31"
near-jsonrpc-client = "0.18"
near-jsonrpc-primitives = "0.31"
borsh = "1.5"
ed25519-dalek = "2.1"
bs58 = "0.5"

[dev-dependencies]
once_cell = "1.19"

[patch.crates-io]
sapling-crypto = { git = "https://github.com/QED-it/sapling-crypto", rev = "9393f93fe547d1b3738c9f4618c0f8a2fffed29f" }
orchard = { git = "https://github.com/QED-it/orchard", rev = "2083efe8d57e6073914ae296db2d41f8bfe1de50" }
sinsemilla = { git = "https://github.com/zcash/sinsemilla", rev = "aabb707e862bc3d7b803c77d14e5a771bcee3e8c" }
zcash_note_encryption = { git = "https://github.com/zcash/zcash_note_encryption", rev = "9f7e93d42cef839d02b9d75918117941d453f8cb" }
halo2_gadgets = { git = "https://github.com/zcash/halo2", rev = "2308caf68c48c02468b66cfc452dad54e355e32f" }
halo2_proofs = { git = "https://github.com/zcash/halo2", rev = "2308caf68c48c02468b66cfc452dad54e355e32f" }

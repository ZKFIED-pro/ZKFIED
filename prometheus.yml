global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'zkfied-production'
    environment: 'testnet'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'frost-coordinator'
    static_configs:
      - targets: ['frost-coordinator:9090']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'zcashd'
    static_configs:
      - targets: ['zcashd:8232']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'ipfs'
    static_configs:
      - targets: ['ipfs:5001']
    metrics_path: '/debug/metrics/prometheus'
    scrape_interval: 30s
